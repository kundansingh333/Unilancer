<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/metaLOGO.svg" />
    <link rel="canonical" href="https://unilancer.online/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Unilancer — Campus Freelance Marketplace for Students & Alumni</title>
    <meta name="description" content="Unilancer is the ultimate freelance marketplace for university students and alumni. Find gigs, post jobs, hire student developers, and build your career on campus." />
    <meta name="keywords" content="freelance, student freelancer, campus gigs, hire student developers, LPU freelance, college freelance platform, Unilancer" />
    <meta name="author" content="Unilancer" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://unilancer.online/" />
    <meta property="og:title" content="Unilancer — Campus Freelance Marketplace" />
    <meta property="og:description" content="Find gigs, post jobs, and hire student developers. The #1 freelance platform built for university students and alumni." />
    <meta property="og:image" content="https://unilancer.online/og-banner.png" />
    <meta property="og:site_name" content="Unilancer" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://unilancer.online/" />
    <meta name="twitter:title" content="Unilancer — Campus Freelance Marketplace" />
    <meta name="twitter:description" content="Find gigs, post jobs, and hire student developers. The #1 freelance platform built for university students and alumni." />
    <meta name="twitter:image" content="https://unilancer.online/og-banner.png" />

    <!-- JSON-LD: Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Unilancer",
      "url": "https://unilancer.online",
      "logo": "https://unilancer.online/metaLOGO.svg",
      "description": "The ultimate campus freelance marketplace for university students and alumni.",
      "sameAs": [],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "url": "https://unilancer.online/contact"
      }
    }
    </script>

    <!-- JSON-LD: WebSite Schema with SearchAction (Sitelinks Searchbox) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Unilancer",
      "url": "https://unilancer.online",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://unilancer.online/gigs?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
